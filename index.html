<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AtlasHub · Vendas</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3d26">
<link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="icone-180.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--papel:#f4f4ef;--branco:#fff;--tinta:#111a14;--cinza:#5f6b63;--linha:#e2e5dd;--verde:#1d6b45;--verde-2:#145233;--escuro:#0f3d26;--menta:#8ef0b8;--menta-2:#d8f7e5;--ouro:#e9a23b;--erro:#c8473d;--azul:#2f6fd6;
  --f:Montserrat,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--f);background:var(--papel);color:var(--tinta);line-height:1.5;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14.5px;transition:transform .15s,background .2s,opacity .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.b-verde{background:var(--verde);color:#fff}.b-verde:hover{background:var(--verde-2)}
.b-escuro{background:var(--escuro);color:#fff}
.b-menta{background:var(--menta);color:var(--escuro)}
.b-linha{background:#fff;border:1.5px solid var(--linha);color:var(--tinta)}
.b-zap{background:#25d366;color:#04301a}
.b-erro{background:#fff;border:1.5px solid #f1cdc9;color:var(--erro)}
.b-peq{padding:9px 13px;font-size:13px;border-radius:11px}
.campo{display:block;margin-bottom:13px}
.campo>span{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:12px 13px;background:#fff;outline:0;font-size:16px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--verde)}
.campo textarea{min-height:80px;resize:vertical}
.campo small{display:block;color:var(--cinza);font-size:12px;margin-top:5px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.erro-msg{background:#fbecea;color:var(--erro);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.ok-msg{background:var(--menta-2);color:var(--verde-2);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}

/* ===== entrada ===== */
.entrada{min-height:100svh;display:grid;grid-template-columns:1.1fr 1fr}
.e-arte{background:var(--escuro);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.e-arte .globo{position:absolute;right:-18%;top:-10%;width:85%;opacity:.13}
.e-arte img.lg{width:200px;position:relative}
.e-arte h1{font-size:clamp(40px,4.6vw,64px);line-height:.98;font-weight:900;letter-spacing:-.02em;position:relative}
.e-arte h1 span{color:var(--menta)}
.e-arte p{color:#bfe3cf;max-width:440px;margin-top:16px;position:relative;font-weight:500}
.e-lista{display:grid;gap:10px;position:relative}
.e-lista div{display:flex;gap:12px;align-items:center;font-weight:600}
.e-lista i{width:30px;height:30px;border-radius:50%;background:rgba(142,240,184,.15);color:var(--menta);display:grid;place-items:center;font-style:normal;flex:none}
.e-form{display:grid;place-items:center;padding:30px 20px}
.e-caixa{width:min(420px,100%)}
.e-caixa .lg-m{display:none;width:150px;margin:0 auto 22px}
.abas-e{display:grid;grid-template-columns:1fr 1fr;background:#e8ebe3;border-radius:14px;padding:4px;margin-bottom:20px}
.abas-e button{border:0;background:none;border-radius:11px;padding:11px;font-weight:700;color:var(--cinza)}
.abas-e button.on{background:#fff;color:var(--tinta);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.e-caixa h2{font-size:26px;font-weight:800;margin-bottom:4px}
.e-caixa>p{color:var(--cinza);margin-bottom:18px;font-size:14.5px}
.link-peq{display:block;text-align:center;margin-top:14px;font-size:13.5px;font-weight:700;color:var(--verde);background:none;border:0;width:100%}
.aviso-demo{margin-top:18px;background:#fff;border:1.5px dashed var(--linha);border-radius:14px;padding:12px;font-size:13px;color:var(--cinza)}
.aviso-demo .duas{margin-top:10px}
@media (max-width:900px){.entrada{grid-template-columns:1fr}.e-arte{display:none}.e-caixa .lg-m{display:block}}

/* ===== app ===== */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100svh}
.lado{background:var(--escuro);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100svh}
.lado .lg{padding:4px 10px 6px}.lado .lg img{width:150px}
.lado .papel{margin:0 10px 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--menta);font-weight:800}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;color:#bfe3cf;padding:12px;border-radius:12px;font-weight:700;font-size:14.5px;text-align:left;width:100%;position:relative}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:var(--menta);color:var(--escuro)}
.nav .bdg{margin-left:auto;background:var(--ouro);color:#2a1a00;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.lado .rodape{margin-top:auto;display:grid;gap:4px}
.main{padding:28px 32px 110px;min-width:0;max-width:1240px}
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topo h1{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.topo small{display:block;color:var(--cinza);font-size:14px;font-weight:500}
.topo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.topo-m{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .lado{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:60;gap:2px;justify-content:space-around;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .lado .lg,.lado .papel,.lado .rodape{display:none}
  .nav{flex-direction:column;gap:3px;font-size:10.5px;padding:8px 2px;text-align:center;flex:1;border-radius:10px}
  .nav .bdg{position:absolute;top:2px;right:16%;margin:0;padding:1px 6px;font-size:10px}
  .main{padding:0 14px 110px}
  .topo-m{display:flex;align-items:center;gap:10px;background:var(--escuro);margin:0 -14px 18px;padding:14px 14px 16px;color:#fff;position:sticky;top:0;z-index:40}
  .topo-m img{height:30px}
  .topo-m .sair{margin-left:auto;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-weight:700;font-size:12.5px}
  .topo h1{font-size:25px}
}

/* cartões */
.grade{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.g3,.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.kpi b{white-space:nowrap;font-size:clamp(16px,5.2vw,26px);word-break:normal}.card{padding:15px 15px}}
.card{background:#fff;border:1px solid var(--linha);border-radius:20px;padding:18px 20px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .mais{margin-left:auto;font-size:12.5px;color:var(--verde);background:none;border:0;font-weight:800}
.kpi span{font-size:12.5px;font-weight:700;color:var(--cinza)}
.kpi b{display:block;font-size:clamp(22px,2.2vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1.15;margin-top:4px;word-break:break-word}
.kpi small{font-size:12px;color:var(--cinza);font-weight:500}
.kpi.dest{background:var(--escuro);border-color:var(--escuro);color:#fff}.kpi.dest span,.kpi.dest small{color:#bfe3cf}.kpi.dest b{color:var(--menta)}
.hero-v{background:linear-gradient(135deg,#1d6b45,#0f3d26);color:#fff;border-radius:24px;padding:24px;position:relative;overflow:hidden;margin-bottom:14px}
.hero-v::after{content:"";position:absolute;right:-30px;bottom:-60px;width:220px;height:220px;border:22px solid rgba(142,240,184,.12);border-radius:50%}
.hero-v span{font-weight:700;color:#bfe3cf;font-size:14px}
.hero-v b{display:block;font-size:clamp(40px,7vw,60px);font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:4px 0 10px;color:#fff}
.hero-v p{font-size:13.5px;color:#d8f7e5;max-width:420px;position:relative;z-index:1}
.hero-v .pix{display:inline-flex;margin-top:12px;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;position:relative;z-index:1}
.lista .item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--linha)}
.lista .item:last-child{border-bottom:0}
.lista .item.cl{cursor:pointer}.lista .item.cl:hover{background:#fafbf8}
.item b{display:block;font-size:14.5px}
.item .sub{font-size:12.5px;color:var(--cinza);font-weight:500}
.item .dir{text-align:right}
.item .dir b{font-size:15px}
.vazio{color:var(--cinza);font-size:14px;text-align:center;padding:22px 10px;border:1.5px dashed var(--linha);border-radius:14px}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 9px;white-space:nowrap}
.st-aguardando{background:#fff3df;color:#a2620c}.st-negociando{background:#e5efff;color:#2556a8}.st-confirmada{background:var(--menta-2);color:var(--verde-2)}
.st-recusada,.st-perdida{background:#fbecea;color:var(--erro)}.st-cancelada{background:#eef0ec;color:var(--cinza)}.st-pago{background:var(--escuro);color:var(--menta)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtros button{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--cinza)}
.filtros button.on{background:var(--escuro);border-color:var(--escuro);color:#fff}
.filtros input{margin-left:auto;border:1.5px solid var(--linha);border-radius:999px;padding:9px 14px;min-width:220px;outline:0;background:#fff}
@media (max-width:700px){.filtros input{margin-left:0;width:100%}.filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.filtros button{flex:none}.filtros:has(input){flex-wrap:wrap}}

/* produtos */
.prod{background:#fff;border:1px solid var(--linha);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.prod .topo-p{display:flex;gap:12px;align-items:flex-start}
.prod .tag{width:46px;height:46px;border-radius:14px;background:var(--menta-2);color:var(--verde);display:grid;place-items:center;flex:none}
.prod h3{font-size:18px;font-weight:800;line-height:1.2}
.prod .desc{font-size:13.5px;color:var(--cinza);font-weight:500}
.prod .valores{display:flex;gap:10px;flex-wrap:wrap}
.prod .valores div{flex:1;min-width:120px;background:var(--papel);border-radius:14px;padding:10px 12px}
.prod .valores small{display:block;font-size:11.5px;font-weight:700;color:var(--cinza)}
.prod .valores b{font-size:18px;font-weight:900}
.prod .valores .ganho{background:var(--menta-2)}.prod .valores .ganho b{color:var(--verde-2)}
.prod .rec{font-size:12.5px;color:var(--verde-2);font-weight:700}
.prod .bts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod .bts .full{grid-column:1/-1}
.sem-link{font-size:12.5px;color:#a2620c;background:#fff3df;border-radius:10px;padding:8px 10px;font-weight:600}

/* tabela */
.tab-wrap{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab th{text-align:left;color:var(--cinza);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tab td{padding:12px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tab tr:last-child td{border-bottom:0}
.tab td.num,.tab th.num{text-align:right}
.barras{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.barras .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.barras .pilha{flex:1;width:100%;display:flex;align-items:flex-end;gap:4px;justify-content:center}
.barras .b{width:min(28px,40%);border-radius:7px 7px 3px 3px;background:var(--verde);min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.barras .b.c{background:var(--menta)}
.barras small{font-size:11.5px;font-weight:700;color:var(--cinza)}
.legenda{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--cinza);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rank{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--linha)}
.rank:last-child{border-bottom:0}
.rank .pos{width:30px;height:30px;border-radius:50%;background:var(--papel);display:grid;place-items:center;font-weight:900;font-size:13px}
.rank.eu{background:var(--menta-2);border-radius:12px;padding:9px 8px;border:0}
.rank .n{margin-left:auto;font-weight:800}
.passos{display:grid;gap:10px;counter-reset:p}
.passos div{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:500}
.passos div::before{counter-increment:p;content:counter(p);width:26px;height:26px;border-radius:50%;background:var(--escuro);color:var(--menta);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}

/* modal */
.veu{position:fixed;inset:0;z-index:90;background:rgba(10,30,18,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:24px;width:min(560px,100%);max-height:calc(100svh - 28px);overflow:auto;padding:22px;transform:translateY(16px);transition:transform .25s}
.veu.on .modal{transform:none}
.modal .m-topo{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.modal h2{font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.modal .m-topo small{display:block;color:var(--cinza);font-size:13px;font-weight:600}
.modal .x{margin-left:auto;border:0;background:var(--papel);width:38px;height:38px;border-radius:50%;font-size:20px;flex:none}
.det{background:var(--papel);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.det div{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px}
.det div span{color:var(--cinza);font-weight:600}
.det div b{text-align:right;word-break:break-word}
.m-acoes{display:flex;flex-wrap:wrap;gap:8px}
.qr{display:grid;place-items:center;padding:10px 0 14px}
.qr .moldura{background:#fff;border:1px solid var(--linha);border-radius:22px;padding:16px;box-shadow:0 18px 40px rgba(15,61,38,.12)}
.qr svg,.qr img{width:min(280px,70vw);height:auto;display:block}
.qr p{font-size:13px;color:var(--cinza);text-align:center;margin-top:12px;max-width:320px;font-weight:500}
.arquivo{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--linha);border-radius:12px;padding:12px;font-size:13.5px;color:var(--cinza);font-weight:600;cursor:pointer}
.arquivo input{display:none}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;width:min(420px,calc(100% - 24px))}
.toast div{background:var(--escuro);color:#fff;border-radius:16px;padding:13px 16px;box-shadow:0 16px 40px rgba(0,0,0,.25);font-size:14px;animation:entra .35s cubic-bezier(.2,1.3,.4,1)}
.toast div b{display:block;color:var(--menta)}
@keyframes entra{from{transform:translateY(-30px);opacity:0}}
.carregando{min-height:100svh;display:grid;place-items:center;color:var(--cinza);font-weight:700}
.espera{min-height:100svh;display:grid;place-items:center;padding:20px;text-align:center}
.espera .card{max-width:440px;padding:30px 24px}
.espera img{width:150px;margin:0 auto 18px}
.espera h2{font-size:24px;font-weight:900;margin-bottom:8px}
.espera p{color:var(--cinza);margin-bottom:16px}
.barra-demo{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#111a14;color:#fff;border-radius:999px;padding:6px;display:flex;gap:4px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.barra-demo span{padding:6px 10px;color:var(--menta);font-weight:800}
.barra-demo button{border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.barra-demo button.on{background:var(--menta);color:var(--escuro)}
@media (min-width:961px){.barra-demo{bottom:18px}}
.entra{animation:sobe .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></symbol>
  <symbol id="i-caixa" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></symbol>

  <symbol id="i-din" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></symbol>

  <symbol id="i-graf" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-rep" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></symbol>
  <symbol id="i-copia" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

const veu = $('#veu');
function modal(html) { $('#modal').innerHTML = html; veu.classList.add('on'); $$('#modal [data-x]').forEach((b) => (b.onclick = fechar)); }
function fechar() { veu.classList.remove('on'); }
veu.addEventListener('click', (e) => { if (e.target === veu) fechar(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') fechar(); });
const cab = (t, s = '') => `<div class="m-topo"><div><h2>${t}</h2>${s ? `<small>${s}</small>` : ''}</div><button class="x" data-x aria-label="Fechar">×</button></div>`;
function confirmar(t, s, ok, fn) {
  modal(cab(t) + `<p style="color:var(--cinza);margin-bottom:16px">${esc(s)}</p><p class="erro-msg" id="cErro" hidden></p><div class="m-acoes"><button class="btn b-verde" id="cOk">${esc(ok)}</button><button class="btn b-linha" data-x>Cancelar</button></div>`);
  $('#cOk').onclick = async () => { const b = $('#cOk'); b.disabled = true; try { await fn(); fechar(); } catch (e) { $('#cErro').hidden = false; $('#cErro').textContent = erroTxt(e); b.disabled = false; } };
}
function copiar(t, msg) { if (!t) return; (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast('Pronto', msg)).catch(() => { const i = document.createElement('textarea'); i.value = t; document.body.appendChild(i); i.select(); try { document.execCommand('copy'); toast('Pronto', msg); } catch {} i.remove(); }); }
function abrirQR(p) {

  modal(cab(esc(p.nome), `${brl(p.preco)}${p.cobranca === 'mensal' ? ' por mês' : ''} · você ganha ${brl(comissaoDe(p))}`) + `<div class="qr"><div class="moldura">${svg}</div><p>Peça para o cliente apontar a câmera do celular. O pagamento já fica com o seu código (${S.sessao.perfil.codigo}).</p></div>
    <div class="m-acoes"><button class="btn b-linha" id="qCop"><svg class="ico"><use href="#i-copia"/></svg>Copiar link</button><button class="btn b-verde" id="qReg"><svg class="ico"><use href="#i-mais"/></svg>Cliente pagou: registrar venda</button></div>`);
  $('#qCop').onclick = () => copiar(link, 'Link copiado'); $('#qReg').onclick = () => abrirRegistro(p.id);
}
const igLimpo = (s) => String(s || '').trim().toLowerCase().replace(/^.*instagram\.com\//, '').replace(/\?.*$/, '').replace(/[@\/\s]/g, '').slice(0, 60);
function abrirRegistro(pid) {
  const p = S.produtos.find((x) => x.id === pid), ind = p.modo === 'indicacao';
  modal(cab(ind ? 'Indicar cliente' : 'Registrar venda', `${esc(p.nome)}${ind ? '' : ' · ' + brl(p.preco) + ' · você ganha ' + brl(comissaoDe(p))}`) + `
    <p class="erro-msg" id="rErro" hidden></p>
    <div class="duas"><label class="campo"><span>Nome do cliente</span><input id="rNome" autocomplete="off"></label><label class="campo"><span>WhatsApp do cliente</span><input id="rTel" inputmode="tel" placeholder="(47) 99999-9999"></label></div>
    <div class="duas"><label class="campo"><span>Estabelecimento</span><input id="rEmp" placeholder="Nome do negócio"></label><label class="campo"><span>Cidade</span><input id="rCid"></label></div>
    <label class="campo"><span>Instagram do cliente (opcional)</span><input id="rIg" autocomplete="off" autocapitalize="off" placeholder="@perfildocliente"></label>
    ${ind ? '' : `<label class="arquivo" id="rArqL"><svg class="ico"><use href="#i-clip"/></svg><span id="rArqT">Anexar print do pagamento (recomendado)</span><input type="file" id="rArq" accept="image/*,application/pdf"></label><div style="height:12px"></div>`}
    <label class="campo"><span>Observação (opcional)</span><textarea id="rObs" placeholder="${ind ? 'O que o cliente precisa? Melhor horário para falar com ele...' : 'Algo que a AtlasHub precise saber sobre o cliente'}"></textarea></label>
    <button class="btn b-verde" style="width:100%" id="rOk">${ind ? 'Enviar indicação' : 'Registrar venda'}</button>`);
  $('#rArq') && ($('#rArq').onchange = (e) => { const f = e.target.files[0]; $('#rArqT').textContent = f ? f.name : 'Anexar print do pagamento (recomendado)'; });
  $('#rOk').onclick = async () => {
    const b = $('#rOk'), err = $('#rErro'); err.hidden = true;
    const dados = { produto_id: p.id, cliente_nome: $('#rNome').value.trim(), cliente_telefone: dig($('#rTel').value), cliente_empresa: $('#rEmp').value.trim(), cliente_cidade: $('#rCid').value.trim(), cliente_instagram: igLimpo($('#rIg').value), obs: $('#rObs').value.trim() };
    const arq = $('#rArq')?.files[0];
    if (dados.cliente_nome.length < 2) { err.hidden = false; err.textContent = 'Informe o nome do cliente.'; return; }
    if (dados.cliente_telefone.length < 10) { err.hidden = false; err.textContent = 'Informe o WhatsApp do cliente com DDD.'; return; }
    if (arq && arq.size > 5 * 1024 * 1024) { err.hidden = false; err.textContent = 'O arquivo precisa ter até 5 MB.'; return; }
    b.disabled = true; b.textContent = 'Enviando...';
    try { await API.registrarVenda(dados, arq, S.sessao.id); fechar(); toast(ind ? 'Indicação enviada' : 'Venda registrada', ind ? 'A AtlasHub vai falar com o cliente.' : 'Assim que for confirmada, a comissão entra para você.'); await carregar(); S.aba = 'vendas'; S.filtro = 'todas'; desenhar(); }
    catch (e) { err.hidden = false; err.textContent = erroTxt(e); b.disabled = false; b.textContent = ind ? 'Enviar indicação' : 'Registrar venda'; }
  };
}
async function abrirVenda(id) {
  const v = S.vendas.find((x) => x.id === id); if (!v) return;
  const dono = S.sessao.tipo === 'dono', ve = dono ? S.vendedores.find((x) => x.user_id === v.vendedor_id) : null, pago = !!v.repasse_id;
  modal(cab(esc(v.cliente_empresa || v.cliente_nome), `${esc(v.produto_nome)} · registrado em ${dataHora(v.criado_em)}`) + `
    <div style="margin-bottom:12px">${chip(v)}</div>
    <div class="det">
      <div><span>Cliente</span><b>${esc(v.cliente_nome)}</b></div><div><span>WhatsApp</span><b>${esc(fone(v.cliente_telefone))}</b></div>
      ${v.cliente_cidade ? `<div><span>Cidade</span><b>${esc(v.cliente_cidade)}</b></div>` : ''}
      ${v.cliente_instagram ? `<div><span>Instagram</span><b><a href="https://instagram.com/${encodeURIComponent(v.cliente_instagram)}" target="_blank" rel="noopener" style="color:var(--verde)">@${esc(v.cliente_instagram)}</a></b></div>` : ''}
      <div><span>Valor</span><b>${v.valor != null ? brl(v.valor) + (v.cobranca === 'mensal' ? '/mês' : '') : 'A definir na proposta'}</b></div>
      <div><span>Comissão</span><b style="color:var(--verde)">${v.comissao != null ? brl(v.comissao) : 'Definida quando fechar'}</b></div>
      ${dono ? `<div><span>Vendedor</span><b>${esc(ve?.nome || '')} (${esc(ve?.codigo || '')})</b></div>` : ''}
      ${v.obs ? `<div><span>Observação</span><b>${esc(v.obs)}</b></div>` : ''}${v.motivo ? `<div><span>Motivo</span><b>${esc(v.motivo)}</b></div>` : ''}
    </div>
    ${v.comprovante ? `<button class="btn b-linha" id="vComp" style="width:100%;margin-bottom:12px"><svg class="ico"><use href="#i-clip"/></svg>Ver comprovante</button>` : ''}
    <p class="erro-msg" id="vErro" hidden></p>
    <div class="m-acoes" id="vAcoes"></div>`);
  const A = $('#vAcoes'), btn = (cls, txt, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { $('#vErro').hidden = false; $('#vErro').textContent = erroTxt(e); b.disabled = false; } }; A.appendChild(b); };
  const linkZap = (txt, cls = 'b-zap') => { const a = document.createElement('a'); a.className = 'btn ' + cls; a.target = '_blank'; a.rel = 'noopener'; a.href = wa(v.cliente_telefone, txt); a.innerHTML = '<svg class="ico"><use href="#i-wa"/></svg>Falar com o cliente'; A.appendChild(a); };
  const feito = async (msg) => { toast('Pronto', msg); await carregar(); fechar(); desenhar(true); };
  $('#vComp') && ($('#vComp').onclick = async () => { try { const u = await API.comprovante(v.comprovante); if (u) open(u, '_blank', 'noopener'); else toast('Prévia', 'Na demonstração não há arquivo.'); } catch (e) { toast('Ops', erroTxt(e)); } });
  if (dono && !pago) {
    if (v.tipo === 'indicacao' && ['aguardando', 'negociando'].includes(v.status)) {
      A.insertAdjacentHTML('beforebegin', `<label class="campo"><span>Valor fechado com o cliente (R$)</span><input id="vValor" inputmode="decimal" placeholder="Ex.: 1500"></label>`);
      btn('b-verde', 'Fechou: confirmar', async () => { const n = num($('#vValor').value); await API.decidir(v.id, 'confirmar', n); await feito('Indicação fechada. Comissão liberada.'); });
      if (v.status === 'aguardando') btn('b-linha', 'Em negociação', async () => { await API.decidir(v.id, 'negociando'); await feito('Marcada como em negociação.'); });
      btn('b-erro', 'Não fechou', async () => { await API.decidir(v.id, 'perdida', null, 'Não fechou'); await feito('Indicação encerrada.'); });
      linkZap(`Olá, ${v.cliente_nome.split(' ')[0]}! Aqui é o Enrico, da AtlasHub. Recebi sua indicação sobre ${v.produto_nome} e queria entender melhor o que você precisa.`);
    } else if (v.status === 'aguardando') {
      btn('b-verde', 'Pagamento conferido: confirmar', async () => { await API.decidir(v.id, 'confirmar'); await feito('Venda confirmada. Comissão liberada para pagamento.'); });
      btn('b-erro', 'Recusar', async () => { const m = prompt('Motivo da recusa (o vendedor vai ver):', 'Pagamento não encontrado'); if (m === null) throw new Error('cancelado'); await API.decidir(v.id, 'recusar', null, m); await feito('Venda recusada.'); });
    } else if (['confirmada', 'recusada', 'perdida'].includes(v.status)) {
      btn('b-linha', 'Voltar para análise', async () => { await API.decidir(v.id, 'reabrir'); await feito('Venda voltou para análise.'); });
    }
    if (v.tipo !== 'indicacao') linkZap(`Olá, ${v.cliente_nome.split(' ')[0]}! Aqui é da AtlasHub. Recebemos sua compra de ${v.produto_nome} e vamos começar.`, 'b-linha');
  } else if (!dono && v.status === 'aguardando') {
    btn('b-erro', 'Cancelar registro', async () => { await API.cancelar(v.id); await feito('Registro cancelado.'); });
  }
  if (pago) A.insertAdjacentHTML('beforeend', '<span class="chip st-pago">Comissão já paga ao vendedor</span>');
}
function editarProduto(p) {
  const n = !p; p = p || { nome: '', descricao: '', categoria: 'combo', modo: 'link', cobranca: 'unica', preco: '', comissao_tipo: 'fixo', comissao_valor: '', comissao_recorrente: '', recorrencia_meses: '', link: '', ativo: true, ordem: S.produtos.length + 1 };
  const op = (o, sel) => Object.entries(o).map(([k, t]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${t}</option>`).join('');
  modal(cab(n ? 'Novo produto' : 'Editar produto') + `<p class="erro-msg" id="pErro" hidden></p>
    <label class="campo"><span>Nome</span><input id="eNome" value="${esc(p.nome)}" placeholder="Ex.: Combo Site + Social media"></label>
    <label class="campo"><span>Descrição (aparece para o vendedor)</span><textarea id="eDesc">${esc(p.descricao)}</textarea></label>
    <div class="duas"><label class="campo"><span>Categoria</span><select id="eCat">${op(CATN, p.categoria)}</select></label><label class="campo"><span>Como vende</span><select id="eModo">${op({ link: 'Link de pagamento', indicacao: 'Indicação (cliente fala com os donos)' }, p.modo)}</select></label></div>
    <div class="duas"><label class="campo"><span>Cobrança</span><select id="eCob">${op({ unica: 'Única', mensal: 'Mensal' }, p.cobranca)}</select></label><label class="campo"><span>Preço (R$)</span><input id="ePreco" inputmode="decimal" value="${p.preco ?? ''}" placeholder="vazio = sob proposta"></label></div>
    <div class="duas"><label class="campo"><span>Comissão</span><select id="eComT">${op({ fixo: 'Valor fixo (R$)', percentual: 'Percentual (%)' }, p.comissao_tipo)}</select></label><label class="campo"><span>Valor da comissão</span><input id="eCom" inputmode="decimal" value="${p.comissao_valor ?? ''}"></label></div>
    <div class="duas"><label class="campo"><span>Comissão por mensalidade (R$)</span><input id="eRec" inputmode="decimal" value="${p.comissao_recorrente ?? ''}" placeholder="só para mensal"></label><label class="campo"><span>Por quantos meses</span><input id="eMeses" inputmode="numeric" value="${p.recorrencia_meses ?? ''}" placeholder="vazio = sempre"></label></div>
    <label class="campo"><span>Link de pagamento (Stripe)</span><input id="eLink" value="${esc(p.link)}" placeholder="https://buy.stripe.com/..."><small>O código do vendedor é acrescentado sozinho em cada link e QR Code.</small></label>
    <div class="duas"><label class="campo"><span>Ordem</span><input id="eOrd" inputmode="numeric" value="${p.ordem ?? 0}"></label><label class="campo"><span>Aparece para os vendedores</span><select id="eAtivo">${op({ sim: 'Sim', nao: 'Não' }, p.ativo ? 'sim' : 'nao')}</select></label></div>
    <button class="btn b-verde" style="width:100%" id="eSalvar">Salvar produto</button>`);
  $('#eSalvar').onclick = async () => {
    const e = $('#pErro'); e.hidden = true;
    const d = { ...(n ? {} : { id: p.id }), nome: $('#eNome').value.trim(), descricao: $('#eDesc').value.trim(), categoria: $('#eCat').value, modo: $('#eModo').value, cobranca: $('#eCob').value, preco: num($('#ePreco').value), comissao_tipo: $('#eComT').value, comissao_valor: num($('#eCom').value) ?? 0, comissao_recorrente: num($('#eRec').value), recorrencia_meses: num($('#eMeses').value) ? Math.round(num($('#eMeses').value)) : null, link: $('#eLink').value.trim(), ativo: $('#eAtivo').value === 'sim', ordem: Math.round(num($('#eOrd').value) || 0) };
    if (d.nome.length < 2) { e.hidden = false; e.textContent = 'Dê um nome ao produto.'; return; }
    if (d.link && !/^https:\/\//.test(d.link)) { e.hidden = false; e.textContent = 'O link precisa começar com https://'; return; }
    if (d.modo === 'link' && d.preco == null) { e.hidden = false; e.textContent = 'Produto com link de pagamento precisa de preço.'; return; }
    if (d.comissao_tipo === 'percentual' && d.comissao_valor > 100) { e.hidden = false; e.textContent = 'O percentual precisa ser até 100.'; return; }
    try { await API.salvarProduto(d); fechar(); toast('Salvo', d.nome); await carregar(); desenhar(true); } catch (x) { e.hidden = false; e.textContent = erroTxt(x); }
  };
}

// ---------- avisos ----------
function toast(t, s) { const d = document.createElement('div'); d.innerHTML = `<b>${esc(t)}</b>${esc(s)}`; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3800); while ($('#toast').children.length > 2) $('#toast').firstElementChild.remove(); }
function plim() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); [784, 1175].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0, c.currentTime + i * .15); g.gain.linearRampToValueAtTime(.16, c.currentTime + i * .15 + .02); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + i * .15 + .45); o.connect(g).connect(c.destination); o.start(c.currentTime + i * .15); o.stop(c.currentTime + i * .15 + .5); }); } catch {} }
function aoMudar(tabela, p) {
  const n = p && p.new, dono = S.sessao?.tipo === 'dono';
  if (tabela === 'vendas' && p?.eventType === 'INSERT' && dono && n.tipo !== 'mensalidade') { toast(n.tipo === 'indicacao' ? 'Nova indicação' : 'Nova venda registrada', `${n.produto_nome} · ${n.cliente_empresa || n.cliente_nome}`); plim(); }
  if (tabela === 'vendas' && p?.eventType === 'UPDATE' && !dono && p.old && n.status !== p.old.status) { if (n.status === 'confirmada') { toast('Venda confirmada!', `+ ${brl(n.comissao)} para receber hoje`); plim(); } else if (n.status === 'recusada') toast('Venda recusada', n.motivo || n.produto_nome); }
  if (tabela === 'repasses' && p?.eventType === 'INSERT' && !dono) { toast('Pagamento enviado', `${brl(n.valor)} no seu Pix`); plim(); }
  if (tabela === 'vendedores' && p?.eventType === 'INSERT' && dono) toast('Novo cadastro de vendedor', n.nome);
  recarregar();
}

let ouvindo = false;
async function iniciarApp() {
  try {
    S.sessao = await API.sessao();
    if (!S.sessao) return telaEntrada();
    if (S.sessao.tipo === 'novo' || (S.sessao.tipo === 'vendedor' && S.sessao.perfil.status !== 'ativo')) { if (!ouvindo && !DEMO) { ouvindo = true; API.ouvir(aoMudar); } return telaEspera(S.sessao); }
    await carregar();
    if (!ouvindo) { ouvindo = true; API.ouvir(aoMudar); }
    desenhar();
  } catch (e) { console.error(e); telaEntrada(erroTxt(e)); }
}
(async () => {
  try { await API.iniciar(); } catch (e) { $('#raiz').innerHTML = '<div class="carregando">Sem conexão. Confira a internet e recarregue a página.</div>'; return; }
  API.aoEntrarPorLink(() => { S.modoEntrada = 'senha'; telaEntrada(); });
  if (/type=recovery/.test(location.hash)) { S.modoEntrada = 'senha'; return telaEntrada(); }
  iniciarApp();
})();
